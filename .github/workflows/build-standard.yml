# Builds ONLY the standard flavor (applicationId com.antigem), which installs
# alongside the official Termux app (com.termux). The termux/termuxShared
# flavors and every source file are untouched: this workflow calls the Gradle
# task :app:assembleStandardRelease directly.
#
# The release signing config in app/build.gradle.kts expects app/release.jks
# (storePassword 123456, keyAlias antigem, keyPassword 123456). The official
# keystore is a repo secret and not part of the source. This workflow uses the
# RELEASE_KEYSTORE_BASE64 secret when present, and otherwise generates a
# keystore with exactly those credentials so the APK is signed and installable.
# Keep the release.jks from the artifacts (e.g. as the secret) so later builds
# stay signed identically and can be installed as updates.

name: Build Standard APK (com.antigem)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag or branch to build from'
        required: false
        default: 'v1.1.6'

jobs:
  build-standard-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # full history: the app's "What's new" page is generated from the git history of version.json
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide signing keystore (app/release.jks)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using the repository secret RELEASE_KEYSTORE_BASE64."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          else
            echo "No secret RELEASE_KEYSTORE_BASE64 found: generating a keystore that matches"
            echo "the credentials hardcoded in app/build.gradle.kts (storePassword 123456,"
            echo "keyAlias antigem, keyPassword 123456). Save release.jks from the artifacts"
            echo "and add it as the secret RELEASE_KEYSTORE_BASE64 to keep future builds"
            echo "signed identically."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias antigem \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=antiGem Standard, OU=antiGem, O=antiGem, C=US"
          fi

      - name: Build standard release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease

      - name: Verify APK (package name, version, signature)
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/standard/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "ERROR: no APK was produced"; exit 1; fi
          echo "APK: $APK"

          EXPECTED_NAME="$(python3 -c "import json; print(json.load(open('version.json'))['version_name'])")"
          EXPECTED_CODE="$(python3 -c "import json; print(json.load(open('version.json'))['version_code'])")"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 | sort -V | tail -n1)"
          echo "--- aapt2 dump badging ---"
          BADGING="$("$AAPT2" dump badging "$APK" | head -n2)"
          echo "$BADGING"

          echo "$BADGING" | grep -q "package: name='com.antigem'" \
            || { echo "ERROR: package name is NOT com.antigem"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" \
            || { echo "ERROR: versionCode is not $EXPECTED_CODE"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$EXPECTED_NAME'" \
            || { echo "ERROR: versionName is not $EXPECTED_NAME"; exit 1; }
          echo "OK: package name com.antigem, versionCode $EXPECTED_CODE, versionName $EXPECTED_NAME"

          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "OK: APK is signed"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION_NAME="$(python3 -c "import json; print(json.load(open('version.json'))['version_name'])")"
          mkdir -p output
          find app/build/outputs/apk/standard/release -name '*.apk' \
            -exec cp {} "output/antiGem-standard-v${VERSION_NAME}-release.apk" \;
          cp app/build/intermediates/agyIdeBridge/agy_ide_bridge \
            "output/agy_ide_bridge-v${VERSION_NAME}-android-arm64"
          echo "--- artifacts ---"
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antiGem-standard-release
          path: output/*
          if-no-files-found: error
